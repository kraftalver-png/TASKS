<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutine • Bygg Bedre Vaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .task-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .task-card:hover { transform: translateY(-4px) scale(1.02); }
    .tab-active { border-bottom: 4px solid #3b82f6; color: white; }
    .section { min-height: 420px; }
  </style>
</head>
<body class="min-h-screen text-white pb-12">
  <div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center text-4xl shadow-lg">📅</div>
        <div>
          <h1 class="text-5xl font-bold tracking-tight">Rutine</h1>
          <p class="text-slate-400">Bygg vaner som varer</p>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <div class="text-right">
          <p id="current-date" class="text-xl font-medium"></p>
          <p id="current-time" class="text-3xl font-mono text-blue-400"></p>
        </div>
        <div onclick="showReflectionModal()" class="cursor-pointer bg-slate-800 hover:bg-slate-700 px-6 py-3 rounded-2xl flex items-center gap-3">
          <i class="fas fa-pen"></i>
          <span>Reflekter</span>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-slate-700 mb-8">
      <button onclick="switchTab(0)" id="tab-0" class="tab-active px-8 py-4 font-semibold">I Dag</button>
      <button onclick="switchTab(1)" id="tab-1" class="px-8 py-4 font-semibold text-slate-400 hover:text-white">Denne Uken</button>
      <button onclick="switchTab(2)" id="tab-2" class="px-8 py-4 font-semibold text-slate-400 hover:text-white">Vaner</button>
    </div>

    <!-- DAG VIEW -->
    <div id="view-day">
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-4">
          <button onclick="prevDay()" class="p-3 hover:bg-slate-800 rounded-2xl"><i class="fas fa-chevron-left"></i></button>
          <h2 id="selected-day-name" class="text-4xl font-bold">Onsdag</h2>
          <button onclick="nextDay()" class="p-3 hover:bg-slate-800 rounded-2xl"><i class="fas fa-chevron-right"></i></button>
        </div>
        
        <div class="flex items-center gap-6">
          <div class="relative w-28 h-28">
            <svg class="w-28 h-28 -rotate-12" viewBox="0 0 42 42">
              <circle cx="21" cy="21" r="15" fill="none" stroke="#334155" stroke-width="6"/>
              <circle id="progress-circle" cx="21" cy="21" r="15" fill="none" stroke="#3b82f6" stroke-width="6" stroke-dasharray="94.2" stroke-dashoffset="0" stroke-linecap="round"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span id="progress-text" class="text-3xl font-bold">0%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Add Task -->
      <div class="bg-slate-800/70 backdrop-blur-xl rounded-3xl p-6 mb-8 border border-slate-700">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
          <div class="md:col-span-5">
            <input id="task-input" type="text" placeholder="Skriv ny oppgave..." class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4 focus:outline-none focus:border-blue-500 text-lg">
          </div>
          <div class="md:col-span-2">
            <select id="category-select" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
              <option value="morning">🌅 Morgen</option>
              <option value="day">☀️ Dag</option>
              <option value="night">🌙 Kveld</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <input id="time-input" type="time" value="08:00" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
          </div>
          <div class="md:col-span-2">
            <select id="priority-select" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
              <option value="high">🔴 Høy</option>
              <option value="medium" selected>🟡 Middels</option>
              <option value="low">🟢 Lav</option>
            </select>
          </div>
          <div class="md:col-span-1">
            <button onclick="addTask()" class="w-full h-full bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-lg">+ Legg til</button>
          </div>
        </div>
      </div>

      <!-- Sections -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="sections"></div>
    </div>

    <!-- UKe VIEW -->
    <div id="view-week" class="hidden">
      <h3 class="text-2xl font-bold mb-6">Denne Uken</h3>
      <div id="week-grid" class="grid grid-cols-7 gap-4"></div>
    </div>

    <!-- Vaner VIEW -->
    <div id="view-habits" class="hidden">
      <h3 class="text-2xl font-bold mb-6">Faste Vaner</h3>
      <p class="text-slate-400 mb-6">Kommer snart – her kan du legge til vaner med egen streak</p>
    </div>

    <!-- Templates -->
    <div class="fixed bottom-6 right-6">
      <button onclick="showTemplates()" class="bg-gradient-to-r from-purple-600 to-pink-600 px-6 py-4 rounded-3xl flex items-center gap-3 shadow-xl hover:scale-105 transition">
        <i class="fas fa-magic"></i>
        <span class="font-semibold">Bruk mal</span>
      </button>
    </div>
  </div>

  <!-- Reflection Modal -->
  <div id="reflection-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-slate-900 rounded-3xl p-8 max-w-lg w-full mx-4">
      <h3 class="text-2xl font-bold mb-6">Hvordan gikk dagen?</h3>
      <div class="flex gap-4 mb-6" id="mood-buttons"></div>
      <textarea id="reflection-text" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4" placeholder="Hva gikk bra? Hva kan bli bedre?"></textarea>
      <div class="flex gap-3 mt-6">
        <button onclick="closeReflection()" class="flex-1 py-4 rounded-2xl border border-slate-600">Avbryt</button>
        <button onclick="saveReflection()" class="flex-1 py-4 bg-emerald-600 rounded-2xl font-semibold">Lagre refleksjon</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let tasks = JSON.parse(localStorage.getItem('ultimateRoutine')) || {};
    let reflections = JSON.parse(localStorage.getItem('reflections')) || {};

    const days = ["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];

    function saveData() {
      localStorage.setItem('ultimateRoutine', JSON.stringify(tasks));
    }

    function getDayKey(date) {
      return date.toISOString().split('T')[0];
    }

    function getCurrentDayKey() {
      return getDayKey(currentDate);
    }

    function ensureDayExists(dayKey) {
      if (!tasks[dayKey]) tasks[dayKey] = [];
    }

    function renderCurrentDay() {
      const dayKey = getCurrentDayKey();
      ensureDayExists(dayKey);
      
      document.getElementById('selected-day-name').textContent = days[currentDate.getDay() === 0 ? 6 : currentDate.getDay() - 1];

      const sectionsHTML = `
        <div class="section" ondrop="drop(event, 'morning')" ondragover="allowDrop(event)">
          <div class="bg-gradient-to-r from-blue-500 to-cyan-500 px-6 py-4 rounded-t-3xl">
            <h3 class="text-2xl font-bold">🌅 Morgen</h3>
          </div>
          <div id="morning-tasks" class="bg-slate-800/70 rounded-b-3xl p-6 space-y-3 min-h-[380px]"></div>
        </div>
        <div class="section" ondrop="drop(event, 'day')" ondragover="allowDrop(event)">
          <div class="bg-gradient-to-r from-amber-500 to-orange-500 px-6 py-4 rounded-t-3xl">
            <h3 class="text-2xl font-bold">☀️ Midt på dagen</h3>
          </div>
          <div id="day-tasks" class="bg-slate-800/70 rounded-b-3xl p-6 space-y-3 min-h-[380px]"></div>
        </div>
        <div class="section" ondrop="drop(event, 'night')" ondragover="allowDrop(event)">
          <div class="bg-gradient-to-r from-purple-500 to-pink-500 px-6 py-4 rounded-t-3xl">
            <h3 class="text-2xl font-bold">🌙 Kveld</h3>
          </div>
          <div id="night-tasks" class="bg-slate-800/70 rounded-b-3xl p-6 space-y-3 min-h-[380px]"></div>
        </div>
      `;
      document.getElementById('sections').innerHTML = sectionsHTML;

      renderTasksForCategory('morning');
      renderTasksForCategory('day');
      renderTasksForCategory('night');
      updateProgress();
    }

    function renderTasksForCategory(category) {
      const container = document.getElementById(category + '-tasks');
      if (!container) return;
      const dayKey = getCurrentDayKey();
      const dayTasks = tasks[dayKey] || [];
      
      const filtered = dayTasks.filter(t => t.category === category).sort((a,b) => a.time.localeCompare(b.time));
      
      container.innerHTML = filtered.length === 0 ? 
        `<p class="text-slate-500 text-center py-12">Ingen oppgaver her ennå</p>` : '';

      filtered.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-card bg-slate-900 border border-slate-700 rounded-2xl p-5 cursor-move ${task.completed ? 'opacity-70' : ''}`;
        div.draggable = true;
        div.ondragstart = (e) => e.dataTransfer.setData("text", JSON.stringify({id: task.id, category: task.category}));
        
        div.innerHTML = `
          <div class="flex items-start gap-4">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleComplete('${dayKey}', ${task.id})" class="mt-1 w-6 h-6 accent-blue-500">
            <div class="flex-1">
              <p class="${task.completed ? 'line-through text-slate-400' : 'font-medium'}">${task.text}</p>
              <div class="flex items-center gap-3 mt-2 text-sm">
                <span class="font-mono text-slate-400">${task.time}</span>
                ${task.priority === 'high' ? '<span class="text-red-400">● Høy</span>' : ''}
                ${task.notes ? '<span class="text-emerald-400 text-xs">📝</span>' : ''}
              </div>
            </div>
            <button onclick="deleteTask('${dayKey}', ${task.id})" class="text-red-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateProgress() {
      const dayKey = getCurrentDayKey();
      const dayTasks = tasks[dayKey] || [];
      const completed = dayTasks.filter(t => t.completed).length;
      const percent = dayTasks.length ?
