<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rutine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); }
    .task-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .task-card:hover { transform: translateY(-6px); }
    .current-day { background-color: #3b82f6; color: white; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5); }
  </style>
</head>
<body class="min-h-screen text-white pb-28">
  <div class="max-w-2xl mx-auto p-4">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 bg-gradient-to-br from-violet-500 via-blue-500 to-cyan-500 rounded-3xl flex items-center justify-center text-4xl shadow-2xl">📅</div>
        <div>
          <h1 class="text-4xl font-bold">Rutine</h1>
          <p class="text-emerald-400 text-sm font-medium">Data lagres automatisk ✅</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="exportData()" class="glass px-4 py-2 rounded-2xl text-xs">📤 Backup</button>
        <button onclick="importData()" class="glass px-4 py-2 rounded-2xl text-xs">📥 Last inn</button>
      </div>
    </div>

    <!-- Dag Navigasjon -->
    <div class="glass rounded-3xl p-3 mb-8 overflow-x-auto">
      <div class="flex gap-2" id="day-nav"></div>
    </div>

    <!-- Tasks -->
    <div id="task-sections" class="space-y-8"></div>
  </div>

  <!-- Floating Add Button -->
  <div onclick="showAddModal()" class="fixed bottom-6 right-6 w-16 h-16 bg-gradient-to-br from-blue-500 to-violet-600 rounded-full flex items-center justify-center text-4xl shadow-2xl hover:scale-110 active:scale-95 transition z-50">
    <i class="fas fa-plus"></i>
  </div>

  <!-- Add Modal -->
  <div id="add-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-end">
    <div class="bg-slate-900 w-full rounded-t-3xl p-6">
      <h3 class="text-2xl font-bold mb-6">Ny oppgave</h3>
      
      <input id="modal-task-input" type="text" placeholder="f.eks. Fotball trening" 
             class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 text-lg mb-4">

      <div class="grid grid-cols-2 gap-4 mb-4">
        <select id="modal-category" class="bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
          <option value="morning">🌅 Morgen</option>
          <option value="day" selected>☀️ Dag</option>
          <option value="night">🌙 Kveld</option>
        </select>
        <input id="modal-time" type="time" value="18:00" class="bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
      </div>

      <select id="modal-recurrence" class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 mb-6">
        <option value="none">Ingen gjentakelse</option>
        <option value="daily">Hver dag</option>
        <option value="wednesday" selected>Hver onsdag</option>
        <option value="monday">Hver mandag</option>
        <option value="tuesday">Hver tirsdag</option>
        <option value="thursday">Hver torsdag</option>
        <option value="friday">Hver fredag</option>
      </select>

      <div class="flex gap-3">
        <button onclick="hideAddModal()" class="flex-1 py-4 border border-slate-600 rounded-2xl">Avbryt</button>
        <button onclick="addTaskFromModal()" class="flex-1 py-4 bg-blue-600 rounded-2xl font-semibold">Legg til</button>
      </div>
    </div>
  </div>

  <!-- Reflection Modal -->
  <div id="reflection-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center">
    <div class="bg-slate-900 rounded-3xl p-8 max-w-md w-full mx-4">
      <h3 class="text-2xl font-bold mb-6">Hvordan gikk dagen?</h3>
      <textarea id="reflection-text" rows="5" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5"></textarea>
      <div class="flex gap-3 mt-6">
        <button onclick="closeReflectionModal()" class="flex-1 py-4 border border-slate-600 rounded-2xl">Avbryt</button>
        <button onclick="saveReflection()" class="flex-1 py-4 bg-emerald-600 rounded-2xl font-semibold">Lagre</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let tasks = JSON.parse(localStorage.getItem('rutinePro2025')) || {};

    const days = ["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"];

    function getDayKey(date) {
      return date.toISOString().split('T')[0];
    }

    function saveTasks() {
      localStorage.setItem('rutinePro2025', JSON.stringify(tasks));
    }

    function ensureDay(key) {
      if (!tasks[key]) tasks[key] = [];
    }

    function renderDayNav() {
      const container = document.getElementById('day-nav');
      container.innerHTML = '';
      for (let i = -5; i <= 5; i++) {
        const d = new Date(currentDate);
        d.setDate(d.getDate() + i);
        const isCurrent = i === 0;
        const btn = document.createElement('button');
        btn.className = `px-5 py-3 rounded-2xl text-center flex-shrink-0 transition-all ${isCurrent ? 'current-day' : 'hover:bg-slate-700'}`;
        btn.innerHTML = `<div class="font-medium">${days[d.getDay()].slice(0,3)}</div><div class="text-xs">${d.getDate()}.${d.getMonth()+1}</div>`;
        btn.onclick = () => { currentDate = d; renderAll(); };
        container.appendChild(btn);
      }
    }

    function renderTasks() {
      const dayKey = getDayKey(currentDate);
      ensureDay(dayKey);

      const sections = [
        {id:'morning', icon:'🌅', title:'Morgen', color:'from-blue-500 to-cyan-500'},
        {id:'day', icon:'☀️', title:'Midt på dagen', color:'from-amber-500 to-orange-500'},
        {id:'night', icon:'🌙', title:'Kveld', color:'from-purple-500 to-pink-500'}
      ];

      let html = '';
      sections.forEach(s => {
        html += `
          <div>
            <div class="bg-gradient-to-r ${s.color} px-6 py-4 rounded-t-3xl">
              <h3 class="text-xl font-bold">${s.icon} ${s.title}</h3>
            </div>
            <div id="${s.id}-tasks" ondrop="drop(event,'${s.id}')" ondragover="allowDrop(event)" class="glass rounded-b-3xl p-4 min-h-[180px]"></div>
          </div>`;
      });
      document.getElementById('task-sections').innerHTML = html;

      sections.forEach(s => renderCategory(s.id));
    }

    function renderCategory(cat) {
      const container = document.getElementById(cat + '-tasks');
      const dayKey = getDayKey(currentDate);
      const filtered = (tasks[dayKey] || []).filter(t => t.category === cat).sort((a,b) => a.time.localeCompare(b.time));

      container.innerHTML = filtered.length === 0 ? 
        `<p class="text-slate-400 text-center py-10">Ingen oppgaver her ennå</p>` : '';

      filtered.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-card glass border border-slate-600 rounded-2xl p-5 mb-4 flex gap-4 ${task.important ? 'border-l-4 border-yellow-400' : ''}`;
        div.draggable = true;
        div.ondragstart = e => e.dataTransfer.setData("text", JSON.stringify({id: task.id}));

        div.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleComplete(${task.id})" class="mt-1 w-6 h-6 accent-blue-500">
          <div class="flex-1">
            <p class="${task.completed ? 'line-through text-slate-400' : 'font-medium'}">${task.text}</p>
            <div class="text-xs text-slate-400 mt-2 flex gap-4">
              <span>${task.time}</span>
              ${task.recurrence && task.recurrence !== 'none' ? `<span class="text-amber-400">↻</span>` : ''}
              ${task.important ? `<span class="text-yellow-400">★ Viktig</span>` : ''}
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <button onclick="toggleImportant(${task.id}); event.stopImmediatePropagation()" class="text-yellow-400 hover:text-yellow-300">
              <i class="fas fa-star"></i>
            </button>
            <button onclick="deleteTask(${task.id}); event.stopImmediatePropagation()" class="text-red-400 hover:text-red-500">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderAll() {
      renderDayNav();
      renderTasks();
    }

    function addTaskFromModal() {
      const text = document.getElementById('modal-task-input').value.trim();
      if (!text) return alert("Skriv inn en oppgave!");

      const dayKey = getDayKey(currentDate);
      ensureDay(dayKey);

      const task = {
        id: Date.now(),
        text,
        category: document.getElementById('modal-category').value,
        time: document.getElementById('modal-time').value || "09:00",
        recurrence: document.getElementById('modal-recurrence').value,
        completed: false,
        important: false
      };

      tasks[dayKey].push(task);
      saveTasks();
      renderAll();
      hideAddModal();
      document.getElementById('modal-task-input').value = '';
    }

    function toggleComplete(id) {
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].map(t => t.id === id ? {...t, completed: !t.completed} : t);
      saveTasks();
      renderAll();
    }

    function toggleImportant(id) {
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].map(t => t.id === id ? {...t, important: !t.important} : t);
      saveTasks();
      renderAll();
    }

    function deleteTask(id) {
      if (!confirm("Slette denne oppgaven permanent?")) return;
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].filter(t => t.id !== id);
      saveTasks();
      renderAll();
    }

    function allowDrop(e) { e.preventDefault(); }
    function drop(e, newCategory) {
      e.preventDefault();
      const data = JSON.parse(e.dataTransfer.getData("text"));
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].map(t => t.id === data.id ? {...t, category: newCategory} : t);
      saveTasks();
      renderAll();
    }

    function showAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modal-task-input').focus(), 150);
    }

    function hideAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function showReflectionModal() {
      document.getElementById('reflection-modal').classList.remove('hidden');
    }

    function closeReflectionModal() {
      document.getElementById('reflection-modal').classList.add('hidden');
    }

    function saveReflection() {
      alert("✅ Refleksjon lagret!");
      closeReflectionModal();
    }

    // Backup & Import
    function exportData() {
      const dataStr = JSON.stringify(tasks, null, 2);
      const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
      const exportFileDefaultName = `rutine_backup_${new Date().toISOString().slice(0,10)}.json`;

      const linkElement = document.createElement('a');
      linkElement.setAttribute('href', dataUri);
      linkElement.setAttribute('download', exportFileDefaultName);
      linkElement.click();
      alert("✅ Backup lastet ned!");
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            const imported = JSON.parse(event.target.result);
            tasks = imported;
            saveTasks();
            renderAll();
            alert("✅ Data importert vellykket!");
          } catch(err) {
            alert("Feil ved import. Filen er ikke gyldig.");
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function init() {
      const todayKey = getDayKey(currentDate);
      if (!tasks[todayKey] || Object.keys(tasks).length === 0) {
        tasks[todayKey] = [
          {id: 1, text: "Fotball trening", category: "day", time: "18:00", recurrence: "wednesday", completed: false, important: true}
        ];
        saveTasks();
      }
      renderAll();
    }

    window.onload = init;
  </script>
</body>
</html>
