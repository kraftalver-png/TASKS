<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutine • Bygg Bedre Vaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .task-card {
      transition: all 0.3s ease;
    }
    .task-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
    }
    .tab-active {
      border-bottom: 4px solid #3b82f6;
      color: white;
    }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="max-w-7xl mx-auto p-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center text-4xl">📅</div>
        <div>
          <h1 class="text-5xl font-bold">Rutine</h1>
          <p class="text-slate-400">Din daglige rytme</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-right">
          <p id="current-date" class="text-lg"></p>
          <p id="current-time" class="text-3xl font-mono text-blue-400"></p>
        </div>
        <button onclick="showReflectionModal()" 
                class="bg-slate-800 hover:bg-slate-700 px-5 py-3 rounded-2xl flex items-center gap-2">
          <i class="fas fa-pen"></i>
          <span>Reflekter</span>
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-slate-700 mb-8 text-lg">
      <button onclick="switchTab(0)" id="tab-0" class="tab-active px-8 py-4 font-semibold">I Dag</button>
      <button onclick="switchTab(1)" id="tab-1" class="px-8 py-4 font-semibold text-slate-400 hover:text-white">Denne Uken</button>
    </div>

    <!-- DAG VIEW -->
    <div id="view-day">
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-4">
          <button onclick="prevDay()" class="p-4 hover:bg-slate-800 rounded-2xl text-2xl"><i class="fas fa-chevron-left"></i></button>
          <h2 id="selected-day-name" class="text-4xl font-bold">Onsdag</h2>
          <button onclick="nextDay()" class="p-4 hover:bg-slate-800 rounded-2xl text-2xl"><i class="fas fa-chevron-right"></i></button>
        </div>

        <div class="flex flex-col items-end">
          <div class="relative w-32 h-32">
            <svg class="w-32 h-32" viewBox="0 0 42 42">
              <circle cx="21" cy="21" r="15" fill="none" stroke="#334155" stroke-width="7"/>
              <circle id="progress-circle" cx="21" cy="21" r="15" fill="none" stroke="#3b82f6" 
                      stroke-width="7" stroke-dasharray="94" stroke-dashoffset="0" stroke-linecap="round"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center text-4xl font-bold" id="progress-text">0%</div>
          </div>
        </div>
      </div>

      <!-- Legg til oppgave -->
      <div class="bg-slate-800/80 backdrop-blur-xl rounded-3xl p-6 mb-8 border border-slate-700">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
          <div class="md:col-span-5">
            <input id="task-input" type="text" placeholder="Skriv ny oppgave..." 
                   class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4 text-lg focus:outline-none focus:border-blue-500">
          </div>
          <div class="md:col-span-2">
            <select id="category-select" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
              <option value="morning">🌅 Morgen</option>
              <option value="day">☀️ Dag</option>
              <option value="night">🌙 Kveld</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <input id="time-input" type="time" value="08:00" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
          </div>
          <div class="md:col-span-2">
            <select id="priority-select" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
              <option value="high">🔴 Høy</option>
              <option value="medium" selected>🟡 Middels</option>
              <option value="low">🟢 Lav</option>
            </select>
          </div>
          <div class="md:col-span-1">
            <button onclick="addTask()" 
                    class="w-full h-full bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-lg">Legg til</button>
          </div>
        </div>
      </div>

      <!-- Oppgaver -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="task-sections"></div>
    </div>

    <!-- UKe VIEW -->
    <div id="view-week" class="hidden text-center py-20 text-slate-400">
      <h3 class="text-3xl font-bold mb-4">Denne Uken</h3>
      <p class="text-lg">Ukeoversikt kommer snart...</p>
    </div>

  </div>

  <!-- Refleksjon Modal -->
  <div id="reflection-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-slate-900 rounded-3xl p-8 max-w-md w-full mx-4">
      <h3 class="text-2xl font-bold mb-6">Hvordan gikk dagen i dag?</h3>
      <textarea id="reflection-text" rows="5" 
                class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 text-lg"
                placeholder="Hva gikk bra? Hva kan bli bedre?"></textarea>
      
      <div class="flex gap-4 mt-8">
        <button onclick="closeReflectionModal()" 
                class="flex-1 py-4 rounded-2xl border border-slate-600 hover:bg-slate-800">Avbryt</button>
        <button onclick="saveReflection()" 
                class="flex-1 py-4 bg-emerald-600 rounded-2xl font-semibold">Lagre refleksjon</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let tasks = JSON.parse(localStorage.getItem('rutineTasks')) || {};

    const daysNorwegian = ["Søndag", "Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag"];

    function getDayKey(date) {
      return date.toISOString().split('T')[0];
    }

    function saveTasks() {
      localStorage.setItem('rutineTasks', JSON.stringify(tasks));
    }

    function ensureDay() {
      const key = getDayKey(currentDate);
      if (!tasks[key]) tasks[key] = [];
    }

    function renderDay() {
      ensureDay();
      const key = getDayKey(currentDate);
      
      document.getElementById('selected-day-name').textContent = daysNorwegian[currentDate.getDay()];

      const html = `
        <div class="space-y-8">
          <!-- Morgen -->
          <div>
            <div class="bg-gradient-to-r from-blue-500 to-cyan-500 px-6 py-4 rounded-t-3xl">
              <h3 class="text-2xl font-bold">🌅 Morgen</h3>
            </div>
            <div id="morning" ondrop="drop(event, 'morning')" ondragover="allowDrop(event)" class="bg-slate-800/70 rounded-b-3xl p-6 min-h-[300px]"></div>
          </div>
          
          <!-- Dag -->
          <div>
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 px-6 py-4 rounded-t-3xl">
              <h3 class="text-2xl font-bold">☀️ Midt på dagen</h3>
            </div>
            <div id="day" ondrop="drop(event, 'day')" ondragover="allowDrop(event)" class="bg-slate-800/70 rounded-b-3xl p-6 min-h-[300px]"></div>
          </div>
          
          <!-- Kveld -->
          <div>
            <div class="bg-gradient-to-r from-purple-500 to-pink-500 px-6 py-4 rounded-t-3xl">
              <h3 class="text-2xl font-bold">🌙 Kveld</h3>
            </div>
            <div id="night" ondrop="drop(event, 'night')" ondragover="allowDrop(event)" class="bg-slate-800/70 rounded-b-3xl p-6 min-h-[300px]"></div>
          </div>
        </div>
      `;

      document.getElementById('task-sections').innerHTML = html;

      renderCategory('morning');
      renderCategory('day');
      renderCategory('night');
      updateProgress();
    }

    function renderCategory(category) {
      const container = document.getElementById(category);
      if (!container) return;

      const dayKey = getDayKey(currentDate);
      const dayTasks = tasks[dayKey] || [];
      const filtered = dayTasks.filter(t => t.category === category)
                             .sort((a, b) => a.time.localeCompare(b.time));

      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-12">Ingen oppgaver ennå</p>`;
        return;
      }

      filtered.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-card bg-slate-900 border border-slate-700 rounded-2xl p-5 mb-3 cursor-move`;
        div.draggable = true;
        div.ondragstart = (e) => {
          e.dataTransfer.setData("text/plain", JSON.stringify({id: task.id, oldCategory: task.category}));
        };

        div.innerHTML = `
          <div class="flex items-start gap-4">
            <input type="checkbox" ${task.completed ? 'checked' : ''} 
                   onchange="toggleComplete(${task.id})" class="mt-1.5 w-6 h-6 accent-blue-500">
            <div class="flex-1">
              <p class="${task.completed ? 'line-through text-slate-400' : 'font-medium'}">${task.text}</p>
              <div class="text-sm text-slate-400 mt-1 flex gap-3">
                <span>${task.time}</span>
                ${task.priority === 'high' ? '<span class="text-red-400">● Høy prioritet</span>' : ''}
              </div>
            </div>
            <button onclick="deleteTask(${task.id})" class="text-red-400 hover:text-red-500">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateProgress() {
      const dayKey = getDayKey(currentDate);
      const dayTasks = tasks[dayKey] || [];
      const completed = dayTasks.filter(t => t.completed).length;
      const percent = dayTasks.length === 0 ? 0 : Math.round((completed / dayTasks.length) * 100);

      document.getElementById('progress-text').textContent = percent + '%';
      
      const circle = document.getElementById('progress-circle');
      const offset = 94 - (94 * percent / 100);
      circle.setAttribute('stroke-dashoffset', offset);

      if (percent === 100 && dayTasks.length > 0) {
        confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
      }
    }

    function addTask() {
      const text = document.getElementById('task-input').value.trim();
      if (!text) return alert("Skriv inn en oppgave!");

      const dayKey = getDayKey(currentDate);
      ensureDay();

      const task = {
        id: Date.now(),
        text: text,
        category: document.getElementById('category-select').value,
        time: document.getElementById('time-input').value || "09:00",
        priority: document.getElementById('priority-select').value,
        completed: false
      };

      tasks[dayKey].push(task);
      saveTasks();
      renderDay();
      document.getElementById('task-input').value = '';
    }

    function toggleComplete(id) {
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].map(task => 
        task.id === id ? {...task, completed: !task.completed} : task
      );
      saveTasks();
      renderDay();
    }

    function deleteTask(id) {
      if (!confirm("Slette denne oppgaven?")) return;
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].filter(task => task.id !== id);
      saveTasks();
      renderDay();
    }

    // Drag & Drop
    function allowDrop(ev) {
      ev.preventDefault();
    }

    function drop(ev, newCategory) {
      ev.preventDefault();
      try {
        const data = JSON.parse(ev.dataTransfer.getData("text/plain"));
        const dayKey = getDayKey(currentDate);
        
        tasks[dayKey] = tasks[dayKey].map(task => {
          if (task.id === data.id) {
            task.category = newCategory;
          }
          return task;
        });
        
        saveTasks();
        renderDay();
      } catch(e) {}
    }

    function switchTab(n) {
      document.getElementById('view-day').classList.toggle('hidden', n !== 0);
      document.getElementById('view-week').classList.toggle('hidden', n !== 1);
      
      document.querySelectorAll('[id^="tab-"]').forEach((el, i) => {
        el.classList.toggle('tab-active', i === n);
      });
    }

    function prevDay() {
      currentDate.setDate(currentDate.getDate() - 1);
      renderDay();
    }

    function nextDay() {
      currentDate.setDate(currentDate.getDate() + 1);
      renderDay();
    }

    function showReflectionModal() {
      document.getElementById('reflection-modal').classList.remove('hidden');
    }

    function closeReflectionModal() {
      document.getElementById('reflection-modal').classList.add('hidden');
    }

    function saveReflection() {
      alert("✅ Refleksjon lagret! Bra jobba.");
      closeReflectionModal();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('current-time').textContent = now.toLocaleTimeString('no-NO', {hour: '2-digit', minute: '2-digit'});
      document.getElementById('current-date').textContent = now.toLocaleDateString('no-NO', {weekday: 'long', day: 'numeric', month: 'long'});
    }

    // Init
    function init() {
      updateClock();
      setInterval(updateClock, 20000);
      renderDay();
    }

    window.onload = init;
  </script>
</body>
</html>
