<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutine - Din Daglige Plan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
    }
    .task-card {
      transition: all 0.3s ease;
    }
    .task-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .section-header {
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
    }
  </style>
</head>
<body class="min-h-screen text-white pb-20">
  <div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-10">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-blue-500 rounded-2xl flex items-center justify-center text-3xl">
          📅
        </div>
        <div>
          <h1 class="text-4xl font-bold">Rutine</h1>
          <p class="text-slate-400">Din daglige rytme</p>
        </div>
      </div>
      <div class="text-right">
        <p id="current-date" class="text-lg font-medium"></p>
        <p id="current-time" class="text-2xl font-mono text-blue-400"></p>
      </div>
    </div>

    <!-- Add Task Form -->
    <div class="bg-slate-800/70 backdrop-blur-xl rounded-3xl p-6 mb-10 shadow-2xl border border-slate-700">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
        <i class="fas fa-plus"></i> Legg til ny rutine
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-5">
          <input id="task-input" 
                 type="text" 
                 placeholder="Hva skal du gjøre? (f.eks. Trene armer)"
                 class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 text-lg">
        </div>
        
        <div class="md:col-span-2">
          <select id="category-select" 
                  class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500">
            <option value="morning">🌅 Morgen</option>
            <option value="day">☀️ Dag</option>
            <option value="night">🌙 Kveld</option>
          </select>
        </div>
        
        <div class="md:col-span-2">
          <input id="time-input" 
                 type="time" 
                 value="08:00"
                 class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500">
        </div>
        
        <div class="md:col-span-3 flex gap-2">
          <button onclick="addTask()" 
                  class="flex-1 bg-blue-600 hover:bg-blue-500 transition-colors rounded-2xl font-semibold py-4">
            Legg til
          </button>
        </div>
      </div>
      
      <!-- Recurrence -->
      <div class="mt-4 flex items-center gap-3 text-sm">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="wednesday-recurring" class="w-5 h-5 accent-blue-500">
          <span>Gjentas hver onsdag</span>
        </label>
      </div>
    </div>

    <!-- Three Sections -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Morgen -->
      <div class="bg-slate-800/70 backdrop-blur-xl rounded-3xl overflow-hidden border border-slate-700">
        <div class="section-header px-6 py-5 text-white">
          <h3 class="text-2xl font-bold flex items-center gap-3">
            🌅 Morgen
          </h3>
        </div>
        <div id="morning-tasks" class="min-h-[400px] p-6 space-y-3 overflow-auto"></div>
      </div>

      <!-- Dag -->
      <div class="bg-slate-800/70 backdrop-blur-xl rounded-3xl overflow-hidden border border-slate-700">
        <div class="section-header bg-gradient-to-r from-amber-500 to-orange-500 px-6 py-5 text-white">
          <h3 class="text-2xl font-bold flex items-center gap-3">
            ☀️ Midt på dagen
          </h3>
        </div>
        <div id="day-tasks" class="min-h-[400px] p-6 space-y-3 overflow-auto"></div>
      </div>

      <!-- Kveld -->
      <div class="bg-slate-800/70 backdrop-blur-xl rounded-3xl overflow-hidden border border-slate-700">
        <div class="section-header bg-gradient-to-r from-indigo-500 to-purple-500 px-6 py-5 text-white">
          <h3 class="text-2xl font-bold flex items-center gap-3">
            🌙 Kveld
          </h3>
        </div>
        <div id="night-tasks" class="min-h-[400px] p-6 space-y-3 overflow-auto"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-green-600 text-white px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3">
    <i class="fas fa-check-circle"></i>
    <span id="toast-text"></span>
  </div>

  <script>
    // Load tasks from localStorage
    let tasks = JSON.parse(localStorage.getItem('routineTasks')) || [];

    function saveTasks() {
      localStorage.setItem('routineTasks', JSON.stringify(tasks));
    }

    function formatDate() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('current-date').textContent = now.toLocaleDateString('no-NO', options);
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours().toString().padStart(2, '0');
      let minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('current-time').textContent = `${hours}:${minutes}`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const category = document.getElementById('category-select').value;
      const time = document.getElementById('time-input').value;
      const isWednesdayRecurring = document.getElementById('wednesday-recurring').checked;

      if (!input.value.trim()) {
        alert("Skriv inn en oppgave!");
        return;
      }

      const newTask = {
        id: Date.now(),
        text: input.value.trim(),
        category: category,
        time: time || "09:00",
        recurringWednesday: isWednesdayRecurring,
        completed: false,
        createdAt: new Date().toISOString()
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();
      
      input.value = '';
      showToast('Oppgave lagt til! ✅');
    }

    function toggleComplete(id) {
      tasks = tasks.map(task => {
        if (task.id === id) task.completed = !task.completed;
        return task;
      });
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      if (confirm("Slette denne oppgaven?")) {
        tasks = tasks.filter(task => task.id !== id);
        saveTasks();
        renderTasks();
      }
    }

    function renderTasks() {
      const morningContainer = document.getElementById('morning-tasks');
      const dayContainer = document.getElementById('day-tasks');
      const nightContainer = document.getElementById('night-tasks');

      morningContainer.innerHTML = '';
      dayContainer.innerHTML = '';
      nightContainer.innerHTML = '';

      // Sort tasks by time
      const sortedTasks = [...tasks].sort((a, b) => a.time.localeCompare(b.time));

      sortedTasks.forEach(task => {
        const taskHTML = `
          <div class="task-card bg-slate-900/80 border border-slate-700 rounded-2xl p-4 ${task.completed ? 'opacity-75' : ''}">
            <div class="flex items-start gap-3">
              <input type="checkbox" 
                     ${task.completed ? 'checked' : ''}
                     onchange="toggleComplete(${task.id})"
                     class="mt-1.5 w-5 h-5 accent-blue-500 cursor-pointer">
              <div class="flex-1">
                <div class="flex items-center justify-between">
                  <p class="font-medium ${task.completed ? 'line-through text-slate-400' : ''}">${task.text}</p>
                  <span class="text-xs font-mono text-slate-400">${task.time}</span>
                </div>
                ${task.recurringWednesday ? 
                  `<div class="text-[10px] text-amber-400 mt-1 flex items-center gap-1">
                    <i class="fas fa-redo"></i> Hver onsdag
                  </div>` : ''}
              </div>
              <button onclick="deleteTask(${task.id})" 
                      class="text-red-400 hover:text-red-500 transition-colors">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;

        if (task.category === 'morning') {
          morningContainer.innerHTML += taskHTML;
        } else if (task.category === 'day') {
          dayContainer.innerHTML += taskHTML;
        } else if (task.category === 'night') {
          nightContainer.innerHTML += taskHTML;
        }
      });

      // Add empty state
      if (morningContainer.children.length === 0) {
        morningContainer.innerHTML = `<p class="text-slate-500 text-center py-12">Ingen morgenrutiner ennå</p>`;
      }
      if (dayContainer.children.length === 0) {
        dayContainer.innerHTML = `<p class="text-slate-500 text-center py-12">Ingen daglige oppgaver ennå</p>`;
      }
      if (nightContainer.children.length === 0) {
        nightContainer.innerHTML = `<p class="text-slate-500 text-center py-12">Ingen kveldsrutiner ennå</p>`;
      }
    }

    // Initialize
    function init() {
      formatDate();
      updateClock();
      setInterval(updateClock, 10000); // Update clock every 10 seconds
      
      renderTasks();
      
      // Demo tasks
      if (tasks.length === 0) {
        tasks = [
          {
            id: 1,
            text: "Trene armer",
            category: "morning",
            time: "07:30",
            recurringWednesday: true,
            completed: false,
            createdAt: new Date().toISOString()
          },
          {
            id: 2,
            text: "Frokost med protein",
            category: "morning",
            time: "08:15",
            recurringWednesday: false,
            completed: true,
            createdAt: new Date().toISOString()
          },
          {
            id: 3,
            text: "Møte med teamet",
            category: "day",
            time: "13:00",
            recurringWednesday: true,
            completed: false,
            createdAt: new Date().toISOString()
          }
        ];
        saveTasks();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
