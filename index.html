<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutine • Bygg Bedre Vaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .task-card { transition: all 0.3s ease; }
    .task-card:hover { transform: translateY(-4px); }
    .current-day { background-color: #3b82f6; color: white; font-weight: 700; }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="max-w-7xl mx-auto p-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center text-4xl">📅</div>
        <div>
          <h1 class="text-5xl font-bold">Rutine</h1>
          <p class="text-slate-400">Din daglige rytme</p>
        </div>
      </div>
      <button onclick="showReflectionModal()" class="bg-slate-800 hover:bg-slate-700 px-5 py-3 rounded-2xl flex items-center gap-2">
        <i class="fas fa-pen"></i> Reflekter
      </button>
    </div>

    <!-- Dag Navigasjon -->
    <div class="flex items-center gap-3 mb-8 bg-slate-800/70 backdrop-blur-xl rounded-3xl p-4 overflow-x-auto">
      <button onclick="prevDay()" class="p-3 hover:bg-slate-700 rounded-2xl"><i class="fas fa-chevron-left"></i></button>
      
      <div id="day-nav" class="flex gap-2"></div>
      
      <button onclick="nextDay()" class="p-3 hover:bg-slate-700 rounded-2xl"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- Add Task -->
    <div class="bg-slate-800/80 backdrop-blur-xl rounded-3xl p-6 mb-8 border border-slate-700">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-4">
          <input id="task-input" type="text" placeholder="Ny oppgave (f.eks. Fotball trening)" 
                 class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4 text-lg">
        </div>
        <div class="md:col-span-2">
          <select id="category-select" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
            <option value="morning">🌅 Morgen</option>
            <option value="day">☀️ Dag</option>
            <option value="night">🌙 Kveld</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <input id="time-input" type="time" value="18:00" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
        </div>
        <div class="md:col-span-2">
          <select id="recurrence-select" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-6 py-4">
            <option value="none">Ingen gjentakelse</option>
            <option value="daily">Hver dag</option>
            <option value="monday">Hver mandag</option>
            <option value="tuesday">Hver tirsdag</option>
            <option value="wednesday" selected>Hver onsdag</option>
            <option value="thursday">Hver torsdag</option>
            <option value="friday">Hver fredag</option>
            <option value="saturday">Hver lørdag</option>
            <option value="sunday">Hver søndag</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <button onclick="addTask()" class="w-full h-full bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-lg">Legg til</button>
        </div>
      </div>
    </div>

    <!-- Tasks -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="task-sections"></div>
  </div>

  <!-- Reflection Modal -->
  <div id="reflection-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-slate-900 rounded-3xl p-8 max-w-md w-full">
      <h3 class="text-2xl font-bold mb-6">Hvordan gikk dagen?</h3>
      <textarea id="reflection-text" rows="5" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5" placeholder="Skriv dine tanker..."></textarea>
      <div class="flex gap-4 mt-6">
        <button onclick="closeReflectionModal()" class="flex-1 py-4 border border-slate-600 rounded-2xl">Avbryt</button>
        <button onclick="saveReflection()" class="flex-1 py-4 bg-emerald-600 rounded-2xl font-semibold">Lagre</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let tasks = JSON.parse(localStorage.getItem('rutineTasks')) || {};
    const days = ["Søndag", "Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag"];

    function getDayKey(date) {
      return date.toISOString().split('T')[0];
    }

    function saveTasks() {
      localStorage.setItem('rutineTasks', JSON.stringify(tasks));
    }

    function ensureDay(dayKey) {
      if (!tasks[dayKey]) tasks[dayKey] = [];
    }

    function propagateRecurringTasks() {
      const todayKey = getDayKey(currentDate);
      ensureDay(todayKey);

      Object.keys(tasks).forEach(dayKey => {
        tasks[dayKey].forEach(task => {
          if (!task.recurrence || task.recurrence === "none") return;

          let shouldAdd = false;
          const taskDate = new Date(dayKey);
          const weekday = taskDate.getDay(); // 0 = søndag

          if (task.recurrence === "daily") shouldAdd = true;
          else if (task.recurrence === "monday" && weekday === 1) shouldAdd = true;
          else if (task.recurrence === "tuesday" && weekday === 2) shouldAdd = true;
          else if (task.recurrence === "wednesday" && weekday === 3) shouldAdd = true;
          else if (task.recurrence === "thursday" && weekday === 4) shouldAdd = true;
          else if (task.recurrence === "friday" && weekday === 5) shouldAdd = true;
          else if (task.recurrence === "saturday" && weekday === 6) shouldAdd = true;
          else if (task.recurrence === "sunday" && weekday === 0) shouldAdd = true;

          if (shouldAdd) {
            const targetKey = getDayKey(currentDate);
            const alreadyExists = tasks[targetKey].some(t => t.text === task.text && t.recurrence);
            if (!alreadyExists) {
              tasks[targetKey].push({...task, id: Date.now() + Math.random()});
            }
          }
        });
      });
    }

    function renderDayNav() {
      const container = document.getElementById('day-nav');
      container.innerHTML = '';

      for (let i = -3; i <= 3; i++) {
        const d = new Date(currentDate);
        d.setDate(d.getDate() + i);
        const key = getDayKey(d);
        const isToday = i === 0;

        const btn = document.createElement('button');
        btn.className = `px-5 py-3 rounded-2xl text-sm whitespace-nowrap transition ${isToday ? 'current-day' : 'hover:bg-slate-700'}`;
        btn.innerHTML = `
          <div>${days[d.getDay()]}</div>
          <div class="text-xs opacity-75">${d.getDate()}.${d.getMonth()+1}</div>
        `;
        btn.onclick = () => {
          currentDate = d;
          renderAll();
        };
        container.appendChild(btn);
      }
    }

    function renderTasks() {
      const dayKey = getDayKey(currentDate);
      ensureDay(dayKey);

      const sectionsHTML = `
        <div class="space-y-8">
          <div>
            <div class="bg-gradient-to-r from-blue-500 to-cyan-500 px-6 py-4 rounded-t-3xl"><h3 class="text-2xl font-bold">🌅 Morgen</h3></div>
            <div id="morning" ondrop="drop(event,'morning')" ondragover="allowDrop(event)" class="bg-slate-800/70 rounded-b-3xl p-6 min-h-[280px]"></div>
          </div>
          <div>
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 px-6 py-4 rounded-t-3xl"><h3 class="text-2xl font-bold">☀️ Midt på dagen</h3></div>
            <div id="day" ondrop="drop(event,'day')" ondragover="allowDrop(event)" class="bg-slate-800/70 rounded-b-3xl p-6 min-h-[280px]"></div>
          </div>
          <div>
            <div class="bg-gradient-to-r from-purple-500 to-pink-500 px-6 py-4 rounded-t-3xl"><h3 class="text-2xl font-bold">🌙 Kveld</h3></div>
            <div id="night" ondrop="drop(event,'night')" ondragover="allowDrop(event)" class="bg-slate-800/70 rounded-b-3xl p-6 min-h-[280px]"></div>
          </div>
        </div>
      `;

      document.getElementById('task-sections').innerHTML = sectionsHTML;

      ['morning','day','night'].forEach(cat => renderCategory(cat));
    }

    function renderCategory(category) {
      const container = document.getElementById(category);
      const dayKey = getDayKey(currentDate);
      const dayTasks = tasks[dayKey] || [];
      const filtered = dayTasks.filter(t => t.category === category).sort((a,b) => a.time.localeCompare(b.time));

      container.innerHTML = filtered.length === 0 ? 
        `<p class="text-slate-500 text-center py-10">Ingen oppgaver her</p>` : '';

      filtered.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-card bg-slate-900 border border-slate-700 rounded-2xl p-5 mb-3 cursor-move flex gap-4`;
        div.draggable = true;
        div.ondragstart = e => e.dataTransfer.setData("text", JSON.stringify({id: task.id}));

        div.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleComplete(${task.id})" class="mt-1 w-6 h-6 accent-blue-500">
          <div class="flex-1">
            <p class="${task.completed ? 'line-through text-slate-400' : ''}">${task.text}</p>
            <div class="flex items-center gap-3 text-sm mt-2">
              <span class="font-mono">${task.time}</span>
              ${task.recurrence && task.recurrence !== 'none' ? 
                `<span class="text-amber-400 text-xs flex items-center gap-1"><i class="fas fa-redo"></i> Gjentas</span>` : ''}
            </div>
          </div>
          <button onclick="deleteTask(${task.id})" class="text-red-400 hover:text-red-500 self-start"><i class="fas fa-trash"></i></button>
        `;
        container.appendChild(div);
      });
    }

    function renderAll() {
      propagateRecurringTasks();
      renderDayNav();
      renderTasks();
    }

    function addTask() {
      const text = document.getElementById('task-input').value.trim();
      if (!text) return alert("Skriv inn en oppgave!");

      const dayKey = getDayKey(currentDate);
      ensureDay(dayKey);

      const task = {
        id: Date.now(),
        text,
        category: document.getElementById('category-select').value,
        time: document.getElementById('time-input').value || "09:00",
        recurrence: document.getElementById('recurrence-select').value,
        completed: false
      };

      tasks[dayKey].push(task);
      saveTasks();
      renderAll();
      document.getElementById('task-input').value = '';
    }

    function toggleComplete(id) {
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].map(t => t.id === id ? {...t, completed: !t.completed} : t);
      saveTasks();
      renderAll();
    }

    function deleteTask(id) {
      if (!confirm("Slette oppgaven?")) return;
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].filter(t => t.id !== id);
      saveTasks();
      renderAll();
    }

    function allowDrop(e) { e.preventDefault(); }
    function drop(e, newCategory) {
      e.preventDefault();
      const data = JSON.parse(e.dataTransfer.getData("text"));
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].map(t => t.id === data.id ? {...t, category: newCategory} : t);
      saveTasks();
      renderAll();
    }

    function prevDay() {
      currentDate.setDate(currentDate.getDate() - 1);
      renderAll();
    }

    function nextDay() {
      currentDate.setDate(currentDate.getDate() + 1);
      renderAll();
    }

    function showReflectionModal() {
      document.getElementById('reflection-modal').classList.remove('hidden');
    }

    function closeReflectionModal() {
      document.getElementById('reflection-modal').classList.add('hidden');
    }

    function saveReflection() {
      alert("✅ Refleksjon lagret!");
      closeReflectionModal();
    }

    function init() {
      // Demo data
      if (Object.keys(tasks).length < 1) {
        const today = getDayKey(currentDate);
        tasks[today] = [
          {id: 1, text: "Fotball trening", category: "day", time: "18:00", recurrence: "wednesday", completed: false}
        ];
      }
      renderAll();
    }

    window.onload = init;
  </script>
</body>
</html>
