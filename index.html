<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rutine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .task-card { transition: all 0.3s ease; }
    .task-card:active { transform: scale(0.97); }
    .current-day { background-color: #3b82f6; color: white; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
      z-index: 50;
    }
    @media (min-width: 768px) {
      .fab { display: none; }
    }
  </style>
</head>
<body class="min-h-screen text-white pb-24">
  <div class="max-w-2xl mx-auto p-4 md:p-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-3xl flex items-center justify-center text-3xl">📅</div>
        <div>
          <h1 class="text-3xl md:text-4xl font-bold">Rutine</h1>
          <p class="text-slate-400 text-sm">Bygg vaner som varer</p>
        </div>
      </div>
      <div class="text-right">
        <div id="streak" class="flex items-center gap-1 text-amber-400 text-sm font-medium"></div>
      </div>
    </div>

    <!-- Dag Navigasjon -->
    <div class="flex items-center gap-2 mb-6 bg-slate-800/70 backdrop-blur-xl rounded-3xl p-2 overflow-x-auto">
      <button onclick="prevDay()" class="p-3 hover:bg-slate-700 rounded-2xl flex-shrink-0"><i class="fas fa-chevron-left"></i></button>
      <div id="day-nav" class="flex gap-2 flex-1"></div>
      <button onclick="nextDay()" class="p-3 hover:bg-slate-700 rounded-2xl flex-shrink-0"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- Add Task (desktop) -->
    <div class="hidden md:block bg-slate-800/80 backdrop-blur-xl rounded-3xl p-5 mb-8 border border-slate-700">
      <div class="grid grid-cols-12 gap-3" id="add-task-form">
        <!-- Filled by JS -->
      </div>
    </div>

    <!-- Tasks -->
    <div id="task-sections" class="space-y-8"></div>
  </div>

  <!-- Floating Action Button (Mobil) -->
  <div onclick="showAddModal()" class="fab md:hidden">
    <i class="fas fa-plus"></i>
  </div>

  <!-- Add Task Modal (for mobil) -->
  <div id="add-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-end md:items-center justify-center">
    <div class="bg-slate-900 w-full max-w-lg md:rounded-3xl md:m-4 rounded-t-3xl p-6">
      <h3 class="text-xl font-semibold mb-5">Ny oppgave</h3>
      <input id="modal-task-input" type="text" placeholder="Hva skal du gjøre?" class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 mb-4">
      
      <div class="grid grid-cols-2 gap-4">
        <select id="modal-category" class="bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
          <option value="morning">🌅 Morgen</option>
          <option value="day">☀️ Dag</option>
          <option value="night">🌙 Kveld</option>
        </select>
        <input id="modal-time" type="time" value="18:00" class="bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
      </div>

      <select id="modal-recurrence" class="w-full mt-4 bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
        <option value="none">Ingen gjentakelse</option>
        <option value="daily">Hver dag</option>
        <option value="wednesday" selected>Hver onsdag</option>
        <option value="monday">Hver mandag</option>
        <!-- flere kan legges til -->
      </select>

      <div class="flex gap-3 mt-8">
        <button onclick="hideAddModal()" class="flex-1 py-4 border border-slate-600 rounded-2xl">Avbryt</button>
        <button onclick="addTaskFromModal()" class="flex-1 py-4 bg-blue-600 rounded-2xl font-semibold">Legg til</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let tasks = JSON.parse(localStorage.getItem('rutineTasks')) || {};
    const days = ["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"];

    function getDayKey(date) { return date.toISOString().split('T')[0]; }

    function saveTasks() {
      localStorage.setItem('rutineTasks', JSON.stringify(tasks));
    }

    function ensureDay(key) {
      if (!tasks[key]) tasks[key] = [];
    }

    function renderDayNav() {
      const container = document.getElementById('day-nav');
      container.innerHTML = '';
      for (let i = -4; i <= 4; i++) {
        const d = new Date(currentDate);
        d.setDate(d.getDate() + i);
        const isCurrent = i === 0;

        const btn = document.createElement('button');
        btn.className = `px-4 py-3 rounded-2xl text-center min-w-[70px] text-sm transition-all ${isCurrent ? 'current-day' : 'hover:bg-slate-700'}`;
        btn.innerHTML = `
          <div class="font-medium">${days[d.getDay()].slice(0,3)}</div>
          <div class="text-xs opacity-75">${d.getDate()}</div>
        `;
        btn.onclick = () => { currentDate = d; renderAll(); };
        container.appendChild(btn);
      }
    }

    function renderTasks() {
      const dayKey = getDayKey(currentDate);
      ensureDay(dayKey);

      let html = '';
      ['morning','day','night'].forEach(cat => {
        const icon = cat === 'morning' ? '🌅' : cat === 'day' ? '☀️' : '🌙';
        const title = cat === 'morning' ? 'Morgen' : cat === 'day' ? 'Dag' : 'Kveld';
        
        html += `
          <div>
            <div class="bg-gradient-to-r ${cat==='morning'?'from-blue-500 to-cyan-500':cat==='day'?'from-amber-500 to-orange-500':'from-purple-500 to-pink-500'} px-5 py-3 rounded-t-3xl">
              <h3 class="font-bold text-xl">${icon} ${title}</h3>
            </div>
            <div id="${cat}-tasks" ondrop="drop(event,'${cat}')" ondragover="allowDrop(event)" class="bg-slate-800/70 rounded-b-3xl p-4 min-h-[180px]"></div>
          </div>
        `;
      });

      document.getElementById('task-sections').innerHTML = html;

      ['morning','day','night'].forEach(cat => renderCategory(cat));
    }

    function renderCategory(cat) {
      const container = document.getElementById(cat + '-tasks');
      const dayKey = getDayKey(currentDate);
      const filtered = (tasks[dayKey] || []).filter(t => t.category === cat)
                                             .sort((a,b) => a.time.localeCompare(b.time));

      container.innerHTML = filtered.length === 0 ? 
        `<p class="text-slate-500 text-center py-8 text-sm">Ingen oppgaver</p>` : '';

      filtered.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-card bg-slate-900 border border-slate-700 rounded-2xl p-4 mb-3 cursor-grab active:cursor-grabbing`;
        div.draggable = true;
        div.ondragstart = e => e.dataTransfer.setData("text", JSON.stringify({id: task.id}));

        div.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" ${task.completed ? 'checked' : ''} 
                   onchange="toggleComplete(${task.id})" class="w-6 h-6 accent-blue-500">
            <div class="flex-1">
              <p class="${task.completed ? 'line-through text-slate-400' : 'font-medium'}">${task.text}</p>
              <div class="text-xs text-slate-400 flex items-center gap-2 mt-1">
                <span>${task.time}</span>
                ${task.recurrence && task.recurrence !== 'none' ? `<span class="text-amber-400">↻</span>` : ''}
              </div>
            </div>
            <button onclick="editTask(${task.id}); event.stopImmediatePropagation()" class="text-slate-400 hover:text-white">
              <i class="fas fa-edit"></i>
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderAll() {
      renderDayNav();
      renderTasks();
      updateStreak();
    }

    function addTask(text, category, time, recurrence) {
      const dayKey = getDayKey(currentDate);
      ensureDay(dayKey);

      const task = {
        id: Date.now(),
        text: text || document.getElementById('modal-task-input').value.trim(),
        category: category || document.getElementById('modal-category').value,
        time: time || document.getElementById('modal-time').value || "09:00",
        recurrence: recurrence || document.getElementById('modal-recurrence').value,
        completed: false
      };

      if (!task.text) return alert("Skriv en oppgave");
      
      tasks[dayKey].push(task);
      saveTasks();
      renderAll();
      hideAddModal();
    }

    function addTaskFromModal() {
      addTask();
    }

    function toggleComplete(id) {
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].map(t => t.id === id ? {...t, completed: !t.completed} : t);
      saveTasks();
      renderAll();
    }

    function editTask(id) {
      const dayKey = getDayKey(currentDate);
      const task = tasks[dayKey].find(t => t.id === id);
      if (!task) return;

      const newText = prompt("Endre oppgave:", task.text);
      if (newText !== null && newText.trim() !== "") {
        task.text = newText.trim();
        saveTasks();
        renderAll();
      }
    }

    function allowDrop(e) { e.preventDefault(); }
    function drop(e, newCat) {
      e.preventDefault();
      const data = JSON.parse(e.dataTransfer.getData("text"));
      const dayKey = getDayKey(currentDate);
      tasks[dayKey] = tasks[dayKey].map(t => t.id === data.id ? {...t, category: newCat} : t);
      saveTasks();
      renderAll();
    }

    function prevDay() { currentDate.setDate(currentDate.getDate()-1); renderAll(); }
    function nextDay() { currentDate.setDate(currentDate.getDate()+1); renderAll(); }

    function showAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
      document.getElementById('modal-task-input').focus();
    }

    function hideAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function updateStreak() {
      // Simple streak (demo)
      document.getElementById('streak').innerHTML = `🔥 <span class="text-lg">7</span> dagers streak`;
    }

    function init() {
      // Demo data
      const todayKey = getDayKey(currentDate);
      if (!tasks[todayKey] || tasks[todayKey].length === 0) {
        tasks[todayKey] = [
          {id: 1, text: "Fotball trening", category: "day", time: "18:00", recurrence: "wednesday", completed: false}
        ];
      }
      renderAll();
    }

    window.onload = init;
  </script>
</body>
</html>
