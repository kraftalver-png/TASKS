<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutine - Bygg Bedre Vaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .task-card { transition: all 0.3s ease; }
    .task-card:hover { transform: translateY(-3px); }
    .day-btn { transition: all 0.2s; }
    .day-btn.active { background-color: #3b82f6; color: white; transform: scale(1.05); }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="flex h-screen">
    
    <!-- Sidebar - Dagvelger -->
    <div class="w-72 bg-slate-900 border-r border-slate-700 p-6 flex flex-col">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-2xl">📅</div>
        <h1 class="text-3xl font-bold">Rutine</h1>
      </div>

      <p class="text-slate-400 mb-4 text-sm font-medium">VELG DAG</p>
      <div id="day-selector" class="grid grid-cols-2 gap-2"></div>

      <div class="mt-auto pt-8 border-t border-slate-700">
        <div class="bg-slate-800 rounded-2xl p-5 text-center">
          <p class="text-4xl font-bold text-emerald-400" id="streak-count">7</p>
          <p class="text-sm text-slate-400">dagers streak 🔥</p>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-auto">
      <div class="max-w-5xl mx-auto p-8">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-10">
          <div>
            <h2 id="selected-day" class="text-4xl font-bold">Onsdag</h2>
            <p id="selected-date" class="text-slate-400"></p>
          </div>
          <div class="text-right">
            <p class="text-lg" id="completion-rate">0% fullført i dag</p>
          </div>
        </div>

        <!-- Add Task -->
        <div class="bg-slate-800/70 backdrop-blur-xl rounded-3xl p-6 mb-10 border border-slate-700">
          <h3 class="font-semibold mb-4 flex items-center gap-2">
            <i class="fas fa-plus"></i> Ny oppgave for denne dagen
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div class="md:col-span-5">
              <input id="task-input" type="text" placeholder="Hva skal du gjøre i dag?" 
                     class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500">
            </div>
            <div class="md:col-span-2">
              <select id="category-select" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-5 py-4">
                <option value="morning">🌅 Morgen</option>
                <option value="day">☀️ Dag</option>
                <option value="night">🌙 Kveld</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <input id="time-input" type="time" value="08:00" 
                     class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-5 py-4">
            </div>
            <div class="md:col-span-2">
              <select id="priority-select" class="w-full bg-slate-900 border border-slate-600 rounded-2xl px-5 py-4">
                <option value="high">🔴 Høy</option>
                <option value="medium" selected>🟡 Middels</option>
                <option value="low">🟢 Lav</option>
              </select>
            </div>
            <div class="md:col-span-1">
              <button onclick="addTask()" 
                      class="w-full h-full bg-blue-600 hover:bg-blue-500 rounded-2xl font-semibold">
                Legg til
              </button>
            </div>
          </div>
        </div>

        <!-- Tasks Sections -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div id="morning-section" class="section"></div>
          <div id="day-section" class="section"></div>
          <div id="night-section" class="section"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const days = ["Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag", "Søndag"];
    let currentDay = "Onsdag";
    let tasks = JSON.parse(localStorage.getItem('routineTasksV2')) || {};

    // Initialize tasks for all days if not exists
    days.forEach(day => {
      if (!tasks[day]) tasks[day] = [];
    });

    function saveTasks() {
      localStorage.setItem('routineTasksV2', JSON.stringify(tasks));
    }

    function renderDaySelector() {
      const container = document.getElementById('day-selector');
      container.innerHTML = '';
      
      days.forEach(day => {
        const isActive = day === currentDay;
        const btn = document.createElement('button');
        btn.className = `day-btn px-4 py-3 rounded-2xl text-sm font-medium ${isActive ? 'active' : 'bg-slate-800 hover:bg-slate-700'}`;
        btn.textContent = day;
        btn.onclick = () => {
          currentDay = day;
          renderDaySelector();
          renderAllTasks();
        };
        container.appendChild(btn);
      });
    }

    function getSectionColor(category) {
      if (category === 'morning') return 'from-blue-500 to-cyan-500';
      if (category === 'day') return 'from-amber-500 to-orange-500';
      return 'from-purple-500 to-pink-500';
    }

    function renderSection(containerId, category, title, icon) {
      const container = document.getElementById(containerId);
      container.innerHTML = `
        <div class="bg-slate-800/70 backdrop-blur-xl rounded-3xl overflow-hidden border border-slate-700">
          <div class="bg-gradient-to-r ${getSectionColor(category)} px-6 py-5">
            <h3 class="text-2xl font-bold flex items-center gap-3">${icon} ${title}</h3>
          </div>
          <div id="${category}-tasks" class="p-6 space-y-3 min-h-[420px]"></div>
        </div>
      `;

      const tasksContainer = document.getElementById(`${category}-tasks`);
      const dayTasks = tasks[currentDay] || [];

      const filtered = dayTasks
        .filter(t => t.category === category)
        .sort((a, b) => a.time.localeCompare(b.time));

      if (filtered.length === 0) {
        tasksContainer.innerHTML = `<p class="text-slate-500 text-center py-16">Ingen oppgaver her ennå</p>`;
        return;
      }

      filtered.forEach(task => {
        const taskEl = document.createElement('div');
        taskEl.className = `task-card bg-slate-900 border border-slate-700 rounded-2xl p-5 ${task.completed ? 'opacity-70' : ''}`;
        taskEl.innerHTML = `
          <div class="flex gap-4">
            <input type="checkbox" ${task.completed ? 'checked' : ''} 
                   onchange="toggleComplete('${currentDay}', ${task.id})"
                   class="mt-1 w-6 h-6 accent-blue-500">
            <div class="flex-1">
              <div class="flex justify-between">
                <p class="${task.completed ? 'line-through text-slate-400' : ''} font-medium">${task.text}</p>
                <span class="text-xs font-mono text-slate-400">${task.time}</span>
              </div>
              <div class="flex gap-2 mt-2">
                ${task.priority === 'high' ? '<span class="text-red-400 text-xs">● Høy prioritet</span>' : ''}
                ${task.priority === 'medium' ? '<span class="text-yellow-400 text-xs">● Middels</span>' : ''}
                ${task.notes ? `<span class="text-slate-400 text-xs">📝 ${task.notes}</span>` : ''}
              </div>
            </div>
            <button onclick="deleteTask('${currentDay}', ${task.id})" class="text-red-400 hover:text-red-500">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        `;
        tasksContainer.appendChild(taskEl);
      });
    }

    function renderAllTasks() {
      renderSection('morning-section', 'morning', 'Morgen', '🌅');
      renderSection('day-section', 'day', 'Midt på dagen', '☀️');
      renderSection('night-section', 'night', 'Kveld', '🌙');
      
      // Update completion rate
      const dayTasks = tasks[currentDay] || [];
      const completed = dayTasks.filter(t => t.completed).length;
      const percentage = dayTasks.length > 0 ? Math.round((completed / dayTasks.length) * 100) : 0;
      document.getElementById('completion-rate').textContent = `${percentage}% fullført i dag`;
    }

    function addTask() {
      const text = document.getElementById('task-input').value.trim();
      if (!text) return alert("Skriv inn en oppgave");

      const newTask = {
        id: Date.now(),
        text: text,
        category: document.getElementById('category-select').value,
        time: document.getElementById('time-input').value,
        priority: document.getElementById('priority-select').value,
        completed: false,
        notes: ""
      };

      if (!tasks[currentDay]) tasks[currentDay] = [];
      tasks[currentDay].push(newTask);
      saveTasks();
      renderAllTasks();

      document.getElementById('task-input').value = '';
    }

    function toggleComplete(day, id) {
      tasks[day] = tasks[day].map(task => {
        if (task.id === id) task.completed = !task.completed;
        return task;
      });
      saveTasks();
      renderAllTasks();
    }

    function deleteTask(day, id) {
      if (confirm("Slette denne oppgaven?")) {
        tasks[day] = tasks[day].filter(task => task.id !== id);
        saveTasks();
        renderAllTasks();
      }
    }

    function init() {
      renderDaySelector();
      renderAllTasks();
      
      // Fake streak for demo
      document.getElementById('streak-count').textContent = "12";
    }

    window.onload = init;
  </script>
</body>
</html>
